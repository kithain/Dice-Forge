name: Qualité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Tests et validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Roll20/Webtracker/requirements.txt

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer les dépendances Python
        run: python -m pip install -r Roll20/Webtracker/requirements.txt

      - name: Tester le compagnon MJ
        run: python -B -m unittest discover -s Roll20/Webtracker/tests -v

      - name: Valider le site et JavaScript
        run: python scripts/validate_project.py

      - name: Tester les potions et leur sauvegarde
        run: node scripts/test_inventory_potions.cjs

      - name: Tester le grimoire et sa sauvegarde
        run: node scripts/test_pj_magic.cjs

      - name: Tester les campagnes et la reprise
        run: |
          node scripts/test_character_store.cjs
          node scripts/test_experience_save.cjs
          node scripts/test_brp_malus.cjs
          python -B -m unittest discover -s migrations/character-v2 -p test_prepare.py -v
