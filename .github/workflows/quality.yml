name: Qualité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Tests et validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Roll20/Webtracker/requirements.txt

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances Python
        run: python -m pip install -r Roll20/Webtracker/requirements.txt

      - name: Tester le compagnon MJ
        run: python -B -m unittest discover -s Roll20/Webtracker/tests -v

      - name: Valider le site et JavaScript
        run: python scripts/validate_project.py
