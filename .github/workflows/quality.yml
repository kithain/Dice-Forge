name: Qualité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Tests et validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Installer les dépendances
        working-directory: app-v2
        run: npm ci

      - name: Tester, typer et compiler la V2
        working-directory: app-v2
        run: npm run check
