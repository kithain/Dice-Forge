<!DOCTYPE html>
<!--
@file obs.html
@description
Vue Observateur (OBS) de la Battle Map VTT, intégrée au serveur Flask du Webtracker.
Affiche en temps réel la carte et les tokens sur un canvas, sans interaction.
À afficher sur un écran secondaire ou comme source dans un logiciel de streaming.
-->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Battle Map - Vue OBS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/battlemap.css') }}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #map-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="map-canvas"></canvas>
    <!-- Client Socket.IO 4.x (compatible avec le serveur Flask-SocketIO). -->
    <script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/obs_app.js') }}"></script>
</body>
</html>
