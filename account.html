<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte — Dice Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css?v=20260810-auth">
  <style>.auth-pending body{visibility:hidden}</style>
  <script src="supabase-config.js"></script>
  <script type="module" src="js/auth-guard.js?v=20260810-auth"></script>
</head>
<body>
  <main class="login-card">
    <p class="login-mark">Mon compte</p>
    <h1 id="account-player">Joueur</h1>
    <p class="login-intro">Choisis un mot de passe personnel après ta première connexion.</p>
    <form id="password-form">
      <label for="new-password">Nouveau mot de passe</label>
      <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">Confirmer le mot de passe</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit">Modifier le mot de passe</button>
      <p class="login-message" id="account-message" role="status"></p>
    </form>
    <a class="login-link login-secondary" href="index.html">Retour à Dice Forge</a>
    <button class="login-secondary" id="logout-button" type="button">Se déconnecter</button>
  </main>
  <script type="module" src="js/account.js?v=20260810-auth"></script>
</body>
</html>
